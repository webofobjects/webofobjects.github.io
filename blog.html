<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blog — Web of Objects</title>

  <link rel="icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">

  <meta name="robots" content="index,follow">
  <meta property="og:site_name" content="Web of Objects">
  <meta property="og:locale" content="en_US">
  <meta property="og:image" content="https://webofobjects.com/preview.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <meta name="title" content="Blog — Web of Objects">
  <meta name="description" content="Web of Objects blog — long-form thoughts, essays and updates.">

  <link rel="canonical" href="https://webofobjects.com/blog.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://webofobjects.com/blog.html">
  <meta property="og:title" content="Blog — Web of Objects">
  <meta property="og:description" content="Web of Objects blog — long-form thoughts, essays and updates.">
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://webofobjects.com/blog.html">
  <meta property="twitter:title" content="Blog — Web of Objects">
  <meta property="twitter:description" content="Web of Objects blog — long-form thoughts, essays and updates.">

  <style>
    :root {
      --bg: #000000;
      --text: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font-family: system-ui, sans-serif;
      padding: 1.2rem;
      overflow-x: hidden;
    }

    /* ---------- HEADER ---------- */
    .logo-top {
      display: flex;
      justify-content: center;
      margin-bottom: -0.2rem;
    }

    .logo-top img {
      width: min(230px, 55vw);
      height: auto;
      filter: drop-shadow(0 0 35px rgba(0, 153, 255, 0.35));
    }

    .main-nav {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
    }

    .main-nav a {
      color: var(--text);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      padding: 0.4rem 0;
      text-align: center;
      width: min(230px, 55vw);
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,0.18);
      background: rgba(255,255,255,0.04);
      transition: 0.15s;
    }

    .main-nav a:hover {
      background: rgba(255,255,255,0.12);
    }

    /* ---------- BLOG INDEX ---------- */
    .blog-index {
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }

    .blog-index h1 {
      font-size: clamp(1.6rem, 3vw, 2.2rem);
      font-weight: 700;
      margin-bottom: 2rem;
    }

    .blog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1.4rem;
    }

    @media (max-width: 640px) {
      .blog-grid { grid-template-columns: 1fr; }
    }

    .blog-card {
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.16);
      background: radial-gradient(circle at top left, rgba(255,255,255,0.08), rgba(0,0,0,0.9));
      padding: 1rem 1.1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
      text-decoration: none;
      color: var(--text);
      transition: 0.15s;
    }

    .blog-card:hover {
      background: radial-gradient(circle at top left, rgba(255,255,255,0.12), rgba(0,0,0,0.9));
      border-color: rgba(255,255,255,0.28);
    }

    .blog-card-img {
      width: 100%;
      height: auto;
      border-radius: 12px;
      margin-bottom: 0.3rem;
    }

    .blog-meta {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.6;
    }

    .blog-card-title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .blog-card-excerpt {
      font-size: 0.9rem;
      opacity: 0.85;
      line-height: 1.45;
    }

    /* ---------- FOOTER ---------- */
    footer {
      margin-top: auto;
      padding-top: 2rem;
      opacity: 0.6;
      font-size: 0.9rem;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="logo-top">
    <a href="/">
      <img src="/logo.png" alt="Web of Objects Home" />
    </a>
  </div>
  <nav class="main-nav">
    <a href="/">Home</a>
  </nav>

  <main class="blog-index">
    <h1>Blog</h1>

    <div class="blog-grid">
      <a href="/blog/europes-time-to-build-the-high-level-os.html" class="blog-card">
        <img class="blog-card-img" src="/blog/high-level-os.webp" alt="High-level OS diagram" loading="lazy" decoding="async" />
        <span class="blog-meta">April 2026</span>
        <span class="blog-card-title">Europe, It's Time to Build the High-Level OS</span>
        <span class="blog-card-excerpt">Europe invented the web. Now it's time to build the next layer — a high-level operating system that decouples applications from infrastructure.</span>
      </a>
    </div>
  </main>

  <footer>
    &copy; 2026 WEB SOCIETY. All rights reserved.
  </footer>

</body>
</html>
